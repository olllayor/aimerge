[project]
name = "aimerge"
version = "0.1.0"
description = "AI-powered Git merge conflict resolver using Google Gemini"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "AIMerge Team", email = "contact@aimerge.dev"}
]
license = {text = "MIT"}
keywords = ["git", "merge", "conflict", "ai", "gemini", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "python-dotenv==1.1.0",
    "google-generativeai==0.8.5",
    "typer==0.16.0",
    "rich==14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-mock==3.14.1",
]

[project.scripts]
aimerge = "src.cli:app"

[project.urls]
Homepage = "https://github.com/olllayor/aimerge"
Repository = "https://github.com/olllayor/aimerge.git"
Issues = "https://github.com/olllayor/aimerge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
include = ["src/"]

[dependency-groups]
dev = [
    "build==1.2.2.post1",
    "twine==6.1.0",
]
